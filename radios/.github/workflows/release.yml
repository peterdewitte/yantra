#
# Release packages (RAD-134, RAD-137; packages workflow as Yantra's TST-64):
# on a version tag the full CI first, then per platform the plugin
# artefacts with the licence bundle, the complete
# corresponding source (this repository with every third_party/ source at
# the pinned versions and the build scripts), SHA-256 checksums and the
# release notes from CHANGELOG.md. Packaging: tools/ci/package_release.sh
# (locally all steps for Linux: `ninja -C build release`,
# tools/ci/make_release.sh). Both packages are built with the cross SDK's
# clang (RAD-139): Linux natively with the fast tests, Windows x64
# cross-compiled (RAD-131, windows-cross.yml, the same jobs as ci.yml) with
# its tests and the conformance kit natively on a Windows runner. By hand
# and on pull requests that touch the packaging the same packages are made
# as workflow artifacts (version v<project version>), without the full CI
# and without a release.

name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "tools/ci/package_release.sh"
      - "tools/ci/make_release.sh"
      - "tools/ci/release_notes.py"
      - "tools/ci/licence_bundle.py"
      - "tools/ci/check_completeness.py"
      - "tools/deps/**"
      - "tools/sdk/**"
      - "CMakePresets.json"
      - ".github/workflows/release.yml"
      - ".github/workflows/windows-cross.yml"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  SDK_KEY: yantra-sdk-${{ hashFiles('tools/sdk/*.lock', 'tools/sdk/yantra_sdk.py') }}

jobs:
  # The package version: the tag (which must name project()'s VERSION),
  # else v<project version>.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=v$(sed -n 's/^project(YantraRadios VERSION \([0-9.]*\) .*/\1/p' CMakeLists.txt)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "$version" || { echo "tag $GITHUB_REF_NAME, project version $version"; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  full-ci:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci-full.yml

  linux-x86-64:
    needs: [version, full-ci]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build python3 binutils gpg zstd \
            pandoc weasyprint fonts-dejavu-core
      - name: Cache the cross SDK (RAD-139)
        uses: actions/cache@v4
        with:
          path: sdk
          key: ${{ env.SDK_KEY }}-${{ runner.os }}-${{ runner.arch }}
      - name: Cross SDK (made from the lock files, else checked)
        run: python3 tools/sdk/yantra_sdk.py check || python3 tools/sdk/yantra_sdk.py make
      - name: Static dependency builds (RAD-136)
        env:
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/tools/sdk/toolchain-x86_64-linux-gnu-clang.cmake
        run: tools/deps/build_deps.sh build/deps
      - name: Build (warnings are errors) and fast tests
        run: |
          cmake --preset ci -DCMAKE_BUILD_TYPE=Release -DYANTRA_DEPS_PREFIX="$PWD/build/deps"
          cmake --build --preset ci -j "$(nproc)"
          ctest --test-dir build -LE slow --timeout 600 --output-on-failure -j "$(nproc)"
      - name: Completeness checks (RAD-133)
        run: python3 tools/ci/check_completeness.py build/bin/plugins
      - name: Release archives of the bundled libraries (corresponding source, RAD-137)
        run: python3 tools/deps/verify_sources.py build/deps-cache
      - name: PDF manual with its checks (RAD-97)
        run: |
          ninja -C build docs-manual
          mkdir -p dist
          cp build/docs/manual/yantra-radios-manual-*.pdf dist/
      - name: Package plugins, licence bundle, manual and source
        run: tools/ci/package_release.sh build dist "$VERSION" linux-x86_64
      - name: Completeness of the packaged plugins (RAD-133, RAD-138)
        run: |
          mkdir -p check
          tar -C check -xzf "dist/yantra-radios-${VERSION}-linux-x86_64.tar.gz"
          python3 tools/ci/check_completeness.py "check/yantra-radios-${VERSION}-linux-x86_64/lib/yantra-radios/plugins"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: dist/

  # Windows x64, cross-compiled with the SDK's clang (RAD-131, RAD-139),
  # packaged, and tested on a Windows runner.
  windows-x64:
    needs: [version, full-ci]
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/windows-cross.yml
    with:
      package: true
      version: ${{ needs.version.outputs.version }}
      build_type: Release

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-x86-64, windows-x64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums over every file (SHA-256)
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: python3 tools/ci/release_notes.py CHANGELOG.md "${GITHUB_REF_NAME}" > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --notes-file notes.md --verify-tag
