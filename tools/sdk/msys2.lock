# Windows x64 (UCRT) target sysroot of the cross SDK (RAD-139): MSYS2
# UCRT64 binary packages from https://repo.msys2.org/mingw/ucrt64, only
# unpacked. 'asked' are the packages wanted (without the
# mingw-w64-ucrt-x86_64- prefix): mingw-w64 headers, CRT and import
# libraries, winpthreads and the GCC runtime (gcc for libstdc++'s headers
# and static libraries, libgcc, libstdc++); their dependencies come along,
# except the 'skip' ones (gcc's own tools: binutils and the libraries of
# the compiler, never part of a program). 'keyring' is the msys2-keyring
# package whose packager keys check every package's .sig.
# tools/sdk/yantra_sdk.py update --msys2
asked headers crt winpthreads libwinpthread gcc libgcc libstdc++
skip binutils gmp isl mpc mpfr windows-default-manifest zlib zstd
