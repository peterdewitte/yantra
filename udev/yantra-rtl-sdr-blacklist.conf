#
# Keeps the kernel's DVB-T drivers off RTL2832U dongles so that the
# RTL-SDR support built into the radio parts' plugins (librtlsdr) can
# claim them as SDR receivers (RAD-99). The install puts it in
# <prefix>/lib/modprobe.d, which the module loader reads for /usr; unplug
# and replug the dongle (or reboot) after installing. Remove the file to
# use the dongle as a DVB-T tuner again.
#
# Adapted from yantra-v1 packaging/udev/yantra-rtl-sdr-blacklist.conf.
blacklist dvb_usb_rtl28xxu
blacklist rtl2832
blacklist rtl2832_sdr
blacklist rtl2830
