# SPDX-FileCopyrightText: 2026 The Yantra contributors
# SPDX-License-Identifier: GPL-3.0-or-later
#
# REUSE annotations (NFR-01, DOC-14) for files that cannot carry an SPDX
# header themselves. Every file that can hold a comment carries its own
# header instead. Keep this file and THIRD_PARTY.md in step.
# The yantra-radios submodule (third_party/yantra-radios, PLG-26) carries
# its own REUSE.toml; reuse lint does not look into submodules.
version = 1

[[annotations]]
path = ["LICENSE"]
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc."
SPDX-License-Identifier = "GPL-3.0-or-later"

# Files without kept comment syntax: the CMake presets (JSON) and the git
# submodule list (`git submodule` rewrites it).
[[annotations]]
path = ["CMakePresets.json", ".gitmodules"]
SPDX-FileCopyrightText = "2026 The Yantra contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# curtat.be logo: trademark of Curtat BV, not GPL (BRD-04). The files are
# the owner's and are kept byte-for-byte, so they are annotated here.
[[annotations]]
path = ["data/branding/curtat_logo.svg", "data/branding/curtat_logo_*.png"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Curtat BV"
SPDX-License-Identifier = "LicenseRef-Curtat-Trademark"

# Yantra logo (BRD-05..07): part of Yantra, GPL-3.0-or-later; used as
# supplied (no header comment added to the SVGs).
[[annotations]]
path = ["data/logo/*.svg", "data/logo/png/*.png"]
precedence = "override"
SPDX-FileCopyrightText = "2026 The Yantra contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# doctest 2.4.12 (MIT), vendored unchanged; tests only (TST-01).
[[annotations]]
path = ["third_party/doctest/doctest/**", "third_party/doctest/LICENSE.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2016-2023 Viktor Kirilov"
SPDX-License-Identifier = "MIT"

# nlohmann/json 3.12.0 (MIT), vendored unchanged (spec 16.2).
[[annotations]]
path = ["third_party/nlohmann_json/include/**", "third_party/nlohmann_json/LICENSE.MIT"]
precedence = "override"
SPDX-FileCopyrightText = "2013-2025 Niels Lohmann"
SPDX-License-Identifier = "MIT"

# stb_image 2.30 and stb_image_write 1.16 (stb at d14d46f), vendored
# unchanged from https://github.com/nothings/stb for the floor plan images
# (IND-02, spec 16.2). Dual-licensed by their author: MIT or public domain
# (Unlicense); the files state it in their last lines, without SPDX tags.
[[annotations]]
path = ["third_party/stb/stb_image.h", "third_party/stb/stb_image_write.h", "third_party/stb/LICENSE"]
precedence = "override"
SPDX-FileCopyrightText = "2017 Sean Barrett"
SPDX-License-Identifier = "MIT OR Unlicense"

# Record files (RAD-65, JSON Lines without a comment syntax), recorded
# from the radio plugins of yantra-radios or written for the tests, and
# golden outputs of the plugin test kit (PLG-13).
[[annotations]]
path = ["plugins/**/testdata/*.jsonl", "plugins/**/testdata/*.golden.json", "tests/**/*.jsonl", "tests/**/*.golden.json"]
SPDX-FileCopyrightText = "2026 The Yantra contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Building model and scene JSON fixtures of the tests (IND-11/12, RAD-36),
# JSON without a comment syntax.
[[annotations]]
path = ["tests/fixtures/building/*.json"]
SPDX-FileCopyrightText = "2026 The Yantra contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"
