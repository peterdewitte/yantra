# SPDX-FileCopyrightText: 2026 The Yantra contributors
# SPDX-License-Identifier: GPL-3.0-or-later
#
# REUSE annotations (RAD-05, Yantra NFR-01) for files that cannot carry an
# SPDX header themselves. Code and documentation files carry their own
# header; vendored and pinned third-party sources get an entry here.
version = 1

[[annotations]]
path = ["LICENSE"]
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc."
SPDX-License-Identifier = "GPL-3.0-or-later"

# Files without comment syntax: the git submodule list (the submodules
# keep their own licences, THIRD_PARTY.md; reuse lint skips them) and the
# CMake presets (JSON).
[[annotations]]
path = [".gitmodules", "CMakePresets.json"]
SPDX-FileCopyrightText = "2026 The Yantra contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Test fixtures in formats without comment syntax (JSON, JSON lines).
[[annotations]]
path = ["tests/fixtures/**/*.json", "tests/fixtures/**/*.jsonl"]
SPDX-FileCopyrightText = "2026 The Yantra contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Scenario files and their scenes (RAD-74), JSON without comment syntax,
# and the golden files of the generator tests.
[[annotations]]
path = ["data/scenarios/**/*.json", "tests/gen_sim/golden/*.txt", "tests/yantra_gen/golden/*.txt"]
SPDX-FileCopyrightText = "2026 The Yantra contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Cargo's generated lock file of the Rust protocol crate (no comment
# syntax that cargo keeps).
[[annotations]]
path = ["receiver/rust/Cargo.lock", "receiver/rust/fuzz/Cargo.lock"]
SPDX-FileCopyrightText = "2026 The Yantra contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# doctest 2.4.12 (MIT), vendored unchanged; tests only.
[[annotations]]
path = ["third_party/doctest/doctest/**", "third_party/doctest/LICENSE.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2016-2023 Viktor Kirilov"
SPDX-License-Identifier = "MIT"

# nlohmann/json 3.12.0 (MIT), vendored unchanged (RAD-04).
[[annotations]]
path = ["third_party/nlohmann_json/include/**", "third_party/nlohmann_json/LICENSE.MIT"]
precedence = "override"
SPDX-FileCopyrightText = "2013-2025 Niels Lohmann"
SPDX-License-Identifier = "MIT"

# pocketfft (C++ header-only, branch cpp at 4d865cb, BSD-3-Clause),
# vendored unchanged (RAD-04, RAD-100).
[[annotations]]
path = ["third_party/pocketfft/pocketfft_hdronly.h", "third_party/pocketfft/LICENSE.md"]
precedence = "override"
SPDX-FileCopyrightText = ["2010-2024 Max-Planck-Society", "The pocketfft authors (see the header of pocketfft_hdronly.h)"]
SPDX-License-Identifier = "BSD-3-Clause"

# talloc 2.4.3 (LGPL-3.0-or-later), vendored subset, unchanged (RAD-136).
[[annotations]]
path = ["third_party/talloc/talloc.c", "third_party/talloc/talloc.h", "third_party/talloc/LICENSE", "third_party/talloc/lib/**"]
precedence = "override"
SPDX-FileCopyrightText = "The talloc authors (see the file headers of the talloc 2.4.3 release)"
SPDX-License-Identifier = "LGPL-3.0-or-later"

# libosmocore 1.11.0 (GPL-2.0-or-later), vendored subset, unchanged
# (RAD-136).
[[annotations]]
path = ["third_party/libosmocore/COPYING", "third_party/libosmocore/src/**", "third_party/libosmocore/include/**"]
precedence = "override"
SPDX-FileCopyrightText = "The libosmocore authors (see the file headers and debian/copyright of the libosmocore 1.11.0 release)"
SPDX-License-Identifier = "GPL-2.0-or-later"

