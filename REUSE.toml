# SPDX-FileCopyrightText: 2026 The Yantra contributors
# SPDX-License-Identifier: GPL-3.0-or-later
#
# REUSE annotations (NFR-01, DOC-14) for files that cannot carry an SPDX
# header themselves. Every file that can hold a comment carries its own
# header instead. Keep this file and THIRD_PARTY.md in step.
# The radio parts in radios/ (PLG-29) carry their own REUSE.toml there
# (REUSE 3.3 reads nested REUSE.toml files); the licence texts they use
# are also in LICENSES/.
version = 1

[[annotations]]
path = ["LICENSE"]
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc."
SPDX-License-Identifier = "GPL-3.0-or-later"

# Files without kept comment syntax: the CMake presets (JSON), the git
# submodule list (`git submodule` rewrites it) and the template of the
# .deb's DEP-5 copyright file.
[[annotations]]
path = ["CMakePresets.json", ".gitmodules", "packaging/deb/copyright.in"]
SPDX-FileCopyrightText = "2026 The Yantra contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# curtat.be logo: trademark of Curtat BV, not GPL (BRD-04). The files are
# the owner's and are kept byte-for-byte, so they are annotated here.
[[annotations]]
path = ["data/branding/curtat_logo.svg", "data/branding/curtat_logo_*.png"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Curtat BV"
SPDX-License-Identifier = "LicenseRef-Curtat-Trademark"

# Yantra logo (BRD-05..07): part of Yantra, GPL-3.0-or-later; used as
# supplied (no header comment added to the SVGs).
[[annotations]]
path = ["data/logo/*.svg", "data/logo/png/*.png"]
precedence = "override"
SPDX-FileCopyrightText = "2026 The Yantra contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The screenshot set (SCR-03) and the animated capture (SCR-06), made by
# tools/screenshots from the app: part
# of Yantra's documentation. The plans in them are the public-domain HABS
# sheets of the Fraunces Tavern (data/demo/fraunces/README.md); the About
# dialog shows the curtat.be logo (trademark of Curtat BV, BRD-04).
[[annotations]]
path = ["docs/img/*.png", "docs/img/*.gif", "docs/img/*.webm"]
precedence = "override"
SPDX-FileCopyrightText = "2026 The Yantra contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["docs/img/about_*.png"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 The Yantra contributors", "2026 Curtat BV"]
SPDX-License-Identifier = "GPL-3.0-or-later AND LicenseRef-Curtat-Trademark"

# The sample report of the Fraunces demo (DEMO-06), made by
# `ninja sample_report` (tools/yantra-demo): Yantra's output with the
# public-domain HABS sheets of the Fraunces Tavern, the curtat.be logo
# (trademark of Curtat BV, BRD-02/04) and embedded subsets of Inter and
# JetBrains Mono (SIL OFL 1.1, which allows embedding).
[[annotations]]
path = ["docs/samples/*.pdf", "docs/samples/*.html"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 The Yantra contributors", "2026 Curtat BV",
                          "Historic American Buildings Survey, Library of Congress"]
SPDX-License-Identifier = "GPL-3.0-or-later AND LicenseRef-Curtat-Trademark AND OFL-1.1 AND LicenseRef-Public-Domain"

# Inter 4.1 (SIL OFL 1.1): the font of the exported floor images and the
# reports (EXP-08), shipped as separate files and loaded at run time.
[[annotations]]
path = ["data/fonts/Inter-*"]
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

# JetBrains Mono 2.304 (SIL OFL 1.1): the numeric tables of the PDF
# reports (EXP-05), shipped as a separate file and loaded at run time.
[[annotations]]
path = ["data/fonts/JetBrainsMono-*"]
precedence = "override"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"

# doctest 2.4.12 (MIT), vendored unchanged; tests only (TST-01).
[[annotations]]
path = ["third_party/doctest/doctest/**", "third_party/doctest/LICENSE.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2016-2023 Viktor Kirilov"
SPDX-License-Identifier = "MIT"

# nlohmann/json 3.12.0 (MIT), vendored unchanged (spec 16.2).
[[annotations]]
path = ["third_party/nlohmann_json/include/**", "third_party/nlohmann_json/LICENSE.MIT"]
precedence = "override"
SPDX-FileCopyrightText = "2013-2025 Niels Lohmann"
SPDX-License-Identifier = "MIT"

# stb_image 2.30 and stb_image_write 1.16 (stb at d14d46f), vendored
# unchanged from https://github.com/nothings/stb for the floor plan images
# (IND-02, spec 16.2). Dual-licensed by their author: MIT or public domain
# (Unlicense); the files state it in their last lines, without SPDX tags.
[[annotations]]
path = ["third_party/stb/stb_image.h", "third_party/stb/stb_image_write.h", "third_party/stb/LICENSE"]
precedence = "override"
SPDX-FileCopyrightText = "2017 Sean Barrett"
SPDX-License-Identifier = "MIT OR Unlicense"

# miniaudio 0.11.25, vendored unchanged from https://github.com/mackron/miniaudio
# (Unlicense OR MIT-0, the user's choice; stated in its LICENSE and at the
# end of miniaudio.h, without SPDX tags).
[[annotations]]
path = ["third_party/miniaudio/miniaudio.h", "third_party/miniaudio/LICENSE"]
precedence = "override"
SPDX-FileCopyrightText = "2025 David Reid"
SPDX-License-Identifier = "Unlicense OR MIT-0"

# Dear ImGui 1.92.9b, vendored unchanged from https://github.com/ocornut/imgui
# (release tag v1.92.9b) with its GLFW and OpenGL 3 backends for the desktop
# app (UI-13, spec 16.2). MIT (LICENSE.txt), without SPDX tags. Its bundled
# stb parts (imstb_*.h) are MIT OR Unlicense; the OpenGL loader generated by
# gl3w is in the public domain (Unlicense text in its header).
[[annotations]]
path = ["third_party/imgui/*.h", "third_party/imgui/*.cpp", "third_party/imgui/LICENSE.txt", "third_party/imgui/backends/**"]
precedence = "override"
SPDX-FileCopyrightText = "2014-2026 Omar Cornut"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["third_party/imgui/imstb_*.h"]
precedence = "override"
SPDX-FileCopyrightText = "2017 Sean Barrett"
SPDX-License-Identifier = "MIT OR Unlicense"

[[annotations]]
path = ["third_party/imgui/backends/imgui_impl_opengl3_loader.h"]
precedence = "override"
SPDX-FileCopyrightText = "The gl3w and imgl3w authors"
SPDX-License-Identifier = "Unlicense"

# CivetWeb 1.16 (THIRD_PARTY.md), vendored unchanged from its release.
[[annotations]]
path = ["third_party/civetweb/**"]
precedence = "override"
SPDX-FileCopyrightText = ["2013-2021 The CivetWeb developers", "2004-2013 Sergey Lyubka", "2013 No Face Press, LLC (Thomas Davis)", "2013 F-Secure Corporation"]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "third_party/civetweb/src/md5.inl"
precedence = "override"
SPDX-FileCopyrightText = "1999, 2000, 2002 Aladdin Enterprises"
SPDX-License-Identifier = "Zlib"

[[annotations]]
path = "third_party/civetweb/src/sha1.inl"
precedence = "override"
SPDX-FileCopyrightText = "Steve Reid (public domain SHA-1)"
SPDX-License-Identifier = "LicenseRef-Public-Domain"

# Record files (RAD-65, JSON Lines without a comment syntax), recorded
# from the radio plugins of yantra-radios or written for the tests, and
# golden outputs of the plugin test kit (PLG-13).
[[annotations]]
path = ["plugins/**/testdata/*.jsonl", "plugins/**/testdata/*.golden.json", "tests/**/*.jsonl", "tests/**/*.golden.json"]
SPDX-FileCopyrightText = "2026 The Yantra contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Building model and scene JSON fixtures of the tests (RAD-36), JSON
# without a comment syntax.
[[annotations]]
path = ["tests/fixtures/building/*.json"]
SPDX-FileCopyrightText = "2026 The Yantra contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# A project file of Yantra 0.3 (the Fraunces demo project made by Yantra
# 0.2.0, schema 7, its plan sources as references only) for the IND-46
# migration test; an SQLite file without a comment syntax.
[[annotations]]
path = ["tests/fixtures/project/*.yantra"]
SPDX-FileCopyrightText = "2026 The Yantra contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Crash regressions of the fuzz targets (TST-12): inputs that once broke a
# parser, replayed by the fuzz ctests.
[[annotations]]
path = ["tests/fuzz/regressions/**"]
SPDX-FileCopyrightText = "2026 The Yantra contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Fraunces Tavern floor plans of the demo project (DEMO-05, DEMO-06,
# DEMO-08): HABS NY-6321 sheets 3 and 4 as served by the Library of
# Congress, public domain (US federal government work), kept unchanged.
# Copied from yantra-v2 68ea20a: REUSE.toml (Fraunces entry).
[[annotations]]
path = ["data/demo/fraunces/*.png"]
precedence = "override"
SPDX-FileCopyrightText = "Historic American Buildings Survey, Library of Congress"
SPDX-License-Identifier = "LicenseRef-Public-Domain"

# The demo project descriptions (Fraunces and the MAK example buildings,
# which hold no plan image), their cell databases, the fixed demo scenes
# of the example floors (DEMO-05, data/demo/scenes/README.md) and the
# DEMO-09 scenario list (JSON and CSV without a kept comment syntax).
[[annotations]]
path = ["data/demo/*.json", "data/demo/fraunces/*.json", "data/demo/fraunces/*.csv", "data/demo/mak/*.json",
        "data/demo/mak/*.csv", "data/demo/scenes/*.json"]
SPDX-FileCopyrightText = "2026 The Yantra contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The UI language files (UI-12; JSON has no comment syntax).
[[annotations]]
path = ["data/i18n/*.json"]
SPDX-FileCopyrightText = "2026 The Yantra contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"
