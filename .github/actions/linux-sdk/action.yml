#
# The Linux build tools and the cross SDK in tools/sdk (OA-02, RAD-139):
# clang and lld of one pinned LLVM release with the Linux and Windows
# sysroots, made from its lock files (and, for Windows, Yantra's MSYS2
# lock) and cached by them; a cached SDK is checked against the locks.
# Used by build.yml (TST-02, TST-64) and the manual workflows. Runs on the
# runner itself (sudo) or in the ubuntu:26.04 container of build.yml (root,
# no sudo; git is installed there before actions/checkout so that the
# osmo-tetra submodule is cloned). The SDK is in <workspace>/sdk and
# YANTRA_SDK_DIR is set for the later steps; the download cache is removed
# once the SDK is made (runner disk space).

name: Linux build tools and cross SDK
description: apt build tools, reuse, and the cross SDK made from the lock files (cached)

inputs:
  packages:
    description: further apt packages (space separated)
    required: false
    default: ""
  windows:
    description: "\"true\": the SDK also gets Yantra's MSYS2 UCRT64 packages (tools/windows/msys2.lock)"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install build tools
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo=; [ "$(id -u)" = 0 ] || sudo=sudo
        $sudo apt-get update
        $sudo apt-get install -y --no-install-recommends \
          cmake ninja-build g++ python3 python3-yaml binutils file pipx gnupg gpgv zstd xz-utils curl \
          ca-certificates libsqlite3-dev libzstd-dev libhpdf-dev pkg-config libglfw3-dev libgl-dev \
          libcurl4-openssl-dev doxygen xvfb xauth libgl1-mesa-dri ${{ inputs.packages }}
        pipx install reuse==5.0.2  # the version the tree is checked with
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Cache the cross SDK (OA-02, RAD-139)
      uses: actions/cache@v4
      with:
        path: sdk
        key: yantra-sdk-${{ hashFiles('tools/sdk/*.lock', 'tools/sdk/yantra_sdk.py') }}-${{ inputs.windows == 'true' && hashFiles('tools/windows/msys2.lock') || 'linux' }}-${{ runner.os }}-${{ runner.arch }}
    - name: Cross SDK (made from the lock files, else checked)
      shell: bash
      env:
        WINDOWS: ${{ inputs.windows }}
      run: |
        echo "YANTRA_SDK_DIR=$GITHUB_WORKSPACE/sdk" >> "$GITHUB_ENV"
        lock=()
        if [ "$WINDOWS" = true ]; then lock=(--msys2-lock tools/windows/msys2.lock); fi
        python3 tools/sdk/yantra_sdk.py check --sdk-dir "$GITHUB_WORKSPACE/sdk" "${lock[@]}" ||
          python3 tools/sdk/yantra_sdk.py make --sdk-dir "$GITHUB_WORKSPACE/sdk" \
            --cache "$GITHUB_WORKSPACE/sdk-cache" "${lock[@]}"
        rm -rf "$GITHUB_WORKSPACE/sdk-cache"
