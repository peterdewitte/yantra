#
# The Linux runner's build tools and the cross SDK of the yantra-radios
# submodule (OA-02, RAD-139): clang and lld of one pinned LLVM release
# with the Linux and Windows sysroots, made from the submodule's lock
# files (and, for Windows, Yantra's MSYS2 lock) and cached by them; a
# cached SDK is checked against the locks. Used by ci.yml (linux-x86-64),
# windows-cross.yml and packages.yml (TST-02, TST-64). Run after
# actions/checkout with the submodules; the SDK is in <workspace>/sdk and
# YANTRA_SDK_DIR is set for the later steps.

name: Linux build tools and cross SDK
description: apt build tools, reuse, and the cross SDK made from the lock files (cached)

inputs:
  packages:
    description: further apt packages (space separated)
    required: false
    default: ""
  windows:
    description: "\"true\": the SDK also gets Yantra's MSYS2 UCRT64 packages (tools/windows/msys2.lock)"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install build tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          cmake ninja-build python3 python3-yaml binutils pipx gpg zstd libsqlite3-dev libzstd-dev libhpdf-dev pkg-config \
          libglfw3-dev libgl-dev libcurl4-openssl-dev doxygen curl ${{ inputs.packages }}
        pipx install reuse
    - name: Cache the cross SDK (OA-02, RAD-139)
      uses: actions/cache@v4
      with:
        path: sdk
        key: yantra-sdk-${{ hashFiles('third_party/yantra-radios/tools/sdk/*.lock', 'third_party/yantra-radios/tools/sdk/yantra_sdk.py') }}-${{ inputs.windows == 'true' && hashFiles('tools/windows/msys2.lock') || 'linux' }}-${{ runner.os }}-${{ runner.arch }}
    - name: Cross SDK (made from the lock files, else checked)
      shell: bash
      env:
        WINDOWS: ${{ inputs.windows }}
      run: |
        echo "YANTRA_SDK_DIR=$GITHUB_WORKSPACE/sdk" >> "$GITHUB_ENV"
        lock=()
        if [ "$WINDOWS" = true ]; then lock=(--msys2-lock tools/windows/msys2.lock); fi
        python3 third_party/yantra-radios/tools/sdk/yantra_sdk.py check --sdk-dir "$GITHUB_WORKSPACE/sdk" "${lock[@]}" ||
          python3 third_party/yantra-radios/tools/sdk/yantra_sdk.py make --sdk-dir "$GITHUB_WORKSPACE/sdk" "${lock[@]}"
