#
# Full CI, nightly and before a release (RAD-134, RAD-90, Yantra
# TST-03/05): every test including slow and opt-in, the scalar build without SIMD
# (same results), the ASan+UBSan and TSan builds, and Linux arm64 (S).
# The x86-64 trees use clang of the cross SDK (RAD-03, RAD-139), cached
# per lock-file version; arm64 has no SDK and builds with the system gcc
# (preset ci-gcc).
# Copied from yantra-v1 c24e8f5: .github/workflows/nightly.yml, adapted.

name: ci-full

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  full:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     name: x86-64, preset: ci,         skip_labels: "",     sdk: true }
          - { os: ubuntu-24.04,     name: scalar, preset: ci-scalar,  skip_labels: "",     sdk: true }
          - { os: ubuntu-24.04,     name: gcc,    preset: ci-gcc,     skip_labels: "",     sdk: false }
          # The sanitizer trees run 4-13x slower than real time: their
          # real-time checks (label timing) cannot hold and are left out.
          - { os: ubuntu-24.04,     name: asan,   preset: asan-ubsan, skip_labels: timing, sdk: true }
          - { os: ubuntu-24.04,     name: tsan,   preset: tsan,       skip_labels: timing, sdk: true }
          - { os: ubuntu-24.04-arm, name: arm64,  preset: ci-gcc,     skip_labels: "",     sdk: false }
    runs-on: ${{ matrix.os }}
    name: full-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ cargo python3 python3-yaml binutils gpg zstd pipx
          pipx install reuse
      - name: Cache the cross SDK (RAD-139)
        if: matrix.sdk
        uses: actions/cache@v4
        with:
          path: sdk
          key: yantra-sdk-${{ hashFiles('tools/sdk/*.lock', 'tools/sdk/yantra_sdk.py') }}-${{ runner.os }}-${{ runner.arch }}
      - name: Cross SDK (made from the lock files, else checked)
        if: matrix.sdk
        run: |
          python3 tools/sdk/yantra_sdk.py check || python3 tools/sdk/yantra_sdk.py make
          echo "CMAKE_TOOLCHAIN_FILE=$PWD/tools/sdk/toolchain-x86_64-linux-gnu-clang.cmake" >> "$GITHUB_ENV"
      - name: Cache the dependency builds (RAD-136)
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ hashFiles('tools/deps/**', 'third_party/**', 'tools/sdk/*.lock') }}-${{ matrix.sdk }}-${{ runner.os }}-${{ runner.arch }}
      # The sanitizer and scalar trees build the bundled libraries in the
      # tree (instrumented); this step keeps the cached prefix build tested
      # (with the tree's compiler: the SDK's toolchain file or gcc).
      - name: Static dependency builds (RAD-136)
        run: tools/deps/build_deps.sh deps
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -B build-full
      - name: Build
        run: cmake --build build-full -j "$(nproc)"
      # YANTRA_TESTS_OPT_IN: the opt-in suites too (label opt_in: the long
      # robustness and sensitivity suites, CONTRIBUTING.md).
      - name: All tests including slow and opt-in
        env:
          YANTRA_TESTS_OPT_IN: 1
          EXCLUDE: ${{ matrix.skip_labels }}
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build-full --timeout 1800 --output-on-failure --repeat until-pass:2 -j "$(nproc)" ${EXCLUDE:+-LE "$EXCLUDE"}
      - name: Completeness checks (RAD-133)
        if: matrix.name == 'x86-64' || matrix.name == 'arm64' || matrix.name == 'scalar'
        run: python3 tools/ci/check_completeness.py build-full/bin/plugins

  # Bounded libFuzzer run of every fuzz target (RAD-96): the cross SDK's
  # clang + ASan/UBSan (preset fuzz), plus the Rust crate's cargo-fuzz
  # targets (stable rustc with RUSTC_BOOTSTRAP=1, see docs/FUZZING.md).
  # Findings are uploaded.
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build python3 cargo gpg zstd
          cargo install --locked cargo-fuzz
      - name: Cache the cross SDK (RAD-139)
        uses: actions/cache@v4
        with:
          path: sdk
          key: yantra-sdk-${{ hashFiles('tools/sdk/*.lock', 'tools/sdk/yantra_sdk.py') }}-${{ runner.os }}-${{ runner.arch }}
      - name: Cross SDK (made from the lock files, else checked)
        run: python3 tools/sdk/yantra_sdk.py check || python3 tools/sdk/yantra_sdk.py make
      - name: Fuzz every target for 5 minutes
        run: tools/ci/fuzz.sh 300
      - name: Findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: build-fuzz/fuzz-artifacts/
