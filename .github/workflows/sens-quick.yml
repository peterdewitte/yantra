#
# Quick sensitivity sweep, on demand (RAD-134, RAD-126): the generator
# scenarios (awgn, cfo, fading) through the receiver, the decode-rate
# curves as an artifact. The sweep tests carry the ctest label "sens";
# until the sweep exists (RAD-126) this workflow fails on purpose
# (--no-tests=error) instead of passing with nothing run.

name: sens-quick

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "ctest regex of the sweep scenarios (empty = all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  sens-quick:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build tools and the cross SDK (RAD-139)
        uses: ./.github/actions/linux-sdk
      - name: Configure and build the radio parts (RAD-141)
        run: |
          cmake --preset radio-parts
          cmake --build --preset radio-parts -j "$(nproc)"
      - name: Sensitivity sweep (label sens)
        env:
          SCENARIOS: ${{ inputs.scenarios }}
          YANTRA_TESTS_OPT_IN: 1
        run: |
          ctest --test-dir build-radios -L sens --no-tests=error --timeout 3600 \
            --output-on-failure ${SCENARIOS:+-R "$SCENARIOS"}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sens-quick
          path: build-radios/sens/
          if-no-files-found: warn
