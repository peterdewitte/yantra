#
# Full CI, nightly and before a release (TST-03, TST-05): every test
# including slow and opt-in, the scalar build without SIMD and without the
# app (same results), the ASan+UBSan and TSan builds (without the label
# timing: the sanitizer trees run far slower than real time) and Linux
# arm64.
# Adapted from yantra-radios fb194f5: .github/workflows/ci-full.yml.

name: nightly

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  full:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     name: x86-64, preset: ci,         skip_labels: "" }
          - { os: ubuntu-24.04,     name: scalar, preset: ci-scalar,  skip_labels: "" }
          - { os: ubuntu-24.04,     name: asan,   preset: asan-ubsan, skip_labels: timing }
          - { os: ubuntu-24.04,     name: tsan,   preset: tsan,       skip_labels: timing }
          - { os: ubuntu-24.04-arm, name: arm64,  preset: ci,         skip_labels: "" }
    runs-on: ${{ matrix.os }}
    name: full-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ python3 python3-yaml pipx libsqlite3-dev
          pipx install reuse
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -B build-full
      - name: Build
        run: cmake --build build-full -j "$(nproc)"
      # YANTRA_TESTS_OPT_IN: the opt-in suites too (label opt_in,
      # CONTRIBUTING.md).
      - name: All tests including slow and opt-in
        env:
          YANTRA_TESTS_OPT_IN: 1
          EXCLUDE: ${{ matrix.skip_labels }}
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build-full --timeout 1800 --output-on-failure --repeat until-pass:2 -j "$(nproc)" ${EXCLUDE:+-LE "$EXCLUDE"}
