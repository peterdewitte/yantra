#
# Windows x64 build with MSYS2 UCRT64 and its gcc (OA-02, TST-02): the
# native second Windows check (the cross build with clang from the SDK, its
# packages and its tests on a Windows runner are in ci.yml: windows-cross,
# windows-x64-tests). Nightly (TST-02, TST-03) and when started by hand; it
# has never run (no remote).
# Adapted from yantra-v2 68ea20a: .github/workflows/windows.yml.

name: windows

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64-ucrt64:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-libharu
            mingw-w64-ucrt-x86_64-glfw
            mingw-w64-ucrt-x86_64-curl-winssl
      - name: Configure (warnings are errors)
        run: cmake --preset ci-gcc
      - name: Build
        run: cmake --build --preset ci-gcc
      - name: Fast tests
        run: ctest --test-dir build-gcc -LE 'slow|timing' --timeout 600 --output-on-failure
      - name: Timing-sensitive tests (retried once)
        run: ctest --test-dir build-gcc -L timing -LE slow --timeout 600 --output-on-failure --repeat until-pass:2
