# SPDX-License-Identifier: GPL-3.0-or-later
#
# Release on a version tag (RAD-134, RAD-137): the full CI first, then per
# platform the plugin artefacts with the licence bundle, the complete
# corresponding source (this repository with every third_party/ source at
# the pinned versions and the build scripts), SHA-256 checksums and the
# release notes from CHANGELOG.md. Packaging: tools/ci/package_release.sh
# (locally all steps for Linux: `ninja -C build release`,
# tools/ci/make_release.sh). Both packages are built with the cross SDK's
# clang (RAD-139): Linux natively, Windows x64 cross-compiled (RAD-131;
# its tests ran natively on Windows in the full CI's ci.yml jobs).

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SDK_KEY: yantra-sdk-${{ hashFiles('tools/sdk/*.lock', 'tools/sdk/yantra_sdk.py') }}

jobs:
  full-ci:
    uses: ./.github/workflows/ci-full.yml

  linux-x86-64:
    needs: full-ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build python3 binutils gpg zstd
      - name: Cache the cross SDK (RAD-139)
        uses: actions/cache@v4
        with:
          path: sdk
          key: ${{ env.SDK_KEY }}-${{ runner.os }}-${{ runner.arch }}
      - name: Cross SDK (made from the lock files, else checked)
        run: python3 tools/sdk/yantra_sdk.py check || python3 tools/sdk/yantra_sdk.py make
      - name: Static dependency builds (RAD-136)
        env:
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/tools/sdk/toolchain-x86_64-linux-gnu-clang.cmake
        run: tools/deps/build_deps.sh build/deps
      - name: Build (warnings are errors) and fast tests
        run: |
          cmake --preset ci -DCMAKE_BUILD_TYPE=Release -DYANTRA_DEPS_PREFIX="$PWD/build/deps"
          cmake --build --preset ci -j "$(nproc)"
          ctest --test-dir build -LE slow --timeout 600 --output-on-failure -j "$(nproc)"
      - name: Completeness checks (RAD-133)
        run: python3 tools/ci/check_completeness.py build/bin/plugins
      - name: Release archives of the bundled libraries (corresponding source, RAD-137)
        run: python3 tools/deps/verify_sources.py build/deps-cache
      - name: Package plugins, licence bundle and source
        run: tools/ci/package_release.sh build dist "${GITHUB_REF_NAME}" linux-x86_64
      - name: Completeness of the packaged plugins (RAD-133, RAD-138)
        run: |
          mkdir -p check
          tar -C check -xzf "dist/yantra-radios-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          python3 tools/ci/check_completeness.py "check/yantra-radios-${GITHUB_REF_NAME}-linux-x86_64/lib/yantra-radios/plugins"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: dist/

  # Windows x64, cross-compiled with the SDK's clang (RAD-131, RAD-139).
  windows-x64:
    needs: full-ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build python3 gpg zstd
      - name: Cache the cross SDK (RAD-139)
        uses: actions/cache@v4
        with:
          path: sdk
          key: ${{ env.SDK_KEY }}-${{ runner.os }}-${{ runner.arch }}
      - name: Cross SDK (made from the lock files, else checked)
        run: python3 tools/sdk/yantra_sdk.py check || python3 tools/sdk/yantra_sdk.py make
      - name: Static dependency builds for Windows (RAD-136)
        env:
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/tools/sdk/toolchain-x86_64-w64-mingw32-clang.cmake
        run: tools/deps/build_deps.sh build-win-deps
      - name: Build (warnings are errors)
        run: |
          cmake --preset ci-windows -DCMAKE_BUILD_TYPE=Release -DYANTRA_DEPS_PREFIX="$PWD/build-win-deps"
          cmake --build --preset ci-windows -j "$(nproc)"
      - name: Completeness checks (RAD-133)
        run: ctest --test-dir build-win -L completeness --timeout 600 --output-on-failure
      - name: Package plugins, programs and licence bundle
        run: tools/ci/package_release.sh build-win dist "${GITHUB_REF_NAME}" windows-x86_64
      - name: Completeness of the packaged plugins (RAD-133, RAD-138)
        run: |
          mkdir -p check
          python3 -m zipfile -e "dist/yantra-radios-${GITHUB_REF_NAME}-windows-x86_64.zip" check
          python3 tools/ci/check_completeness.py --platform windows --objdump sdk/llvm/bin/llvm-objdump \
            "check/yantra-radios-${GITHUB_REF_NAME}-windows-x86_64/lib/yantra-radios/plugins"
          python3 tools/ci/check_completeness.py --platform windows --programs --objdump sdk/llvm/bin/llvm-objdump \
            "check/yantra-radios-${GITHUB_REF_NAME}-windows-x86_64/bin"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          path: dist/

  publish:
    needs: [linux-x86-64, windows-x64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums over every file (SHA-256)
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: python3 tools/ci/release_notes.py CHANGELOG.md "${GITHUB_REF_NAME}" > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --notes-file notes.md --verify-tag
