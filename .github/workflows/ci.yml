# SPDX-License-Identifier: GPL-3.0-or-later
#
# CI on every push to a branch and on pull requests (TST-02, OA-02,
# RAD-134, NFR-09), on GitHub's hosted runners: lint (shell, YAML and
# Python syntax, FFI widths, cargo-deny, the workflow files parsed with
# PyYAML, reuse lint, the vendored sources against their release
# archives); build.yml: in an ubuntu:26.04 container the Linux x86-64 tree
# with clang from the cross SDK in tools/sdk (RAD-139; cached by its lock
# files), warnings as errors, its functional tests (ctest -LE
# "slow|timing"), the radio plugins' completeness checks and conformance
# kit, then the Windows x64 tree cross-compiled from it with the zip and
# setup .exe and the build-machine checks, and the Windows tree's
# functional tests natively on a Windows runner; completeness-clean
# repeats the radio plugins' checks in a bare container (RAD-133).
# No slow, timing or bench tests and no sanitizer trees on hosted runners
# (2 CPUs, Actions minutes of a private repository): nightly.yml, by hand,
# and the build server run them. The gcc tree, the radio parts alone
# (RAD-141) and the documentation site (DOC-20) are jobs here that run only
# when the workflow is started by hand (workflow_dispatch). Tags are built
# by packages.yml, not here.
# Merged from yantra-radios fb194f5 and a35ad3d: .github/workflows/ci.yml.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-yaml pipx
          pipx install reuse
      - name: Cache cargo-deny
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-deny
        run: command -v cargo-deny || cargo install --locked cargo-deny@0.20.2
      - name: Shell, Python and YAML syntax, FFI widths, cargo-deny
        run: YANTRA_LINT_REQUIRE_TOOLS=1 sh tools/ci/lint.sh
      - name: Workflow YAML parses (PyYAML)
        run: |
          python3 -c 'import sys, yaml
          for f in sys.argv[1:]:
              yaml.safe_load(open(f))' .github/workflows/*.yml .github/actions/*/action.yml
      - name: REUSE compliance
        run: reuse lint
      - name: Vendored sources match their release archives (RAD-136)
        run: python3 tools/deps/verify_sources.py build/deps-cache

  # The Linux and Windows trees and their functional tests (build.yml).
  build:
    uses: ./.github/workflows/build.yml

  # RAD-133: the radio plugins in a clean environment, without SoapySDR or
  # vendor packages: a bare container that only gets the built plugins,
  # the fake-module test builds (RAD-92), the test host and Python. It
  # re-runs the NEEDED and export checks and the conformance kit on every
  # plugin where no build dependency is installed. Locally the same script
  # runs in a bubblewrap sandbox (ctest clean_env_conformance).
  completeness-clean:
    needs: build
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86-64-radio-plugins
          path: kit
      - name: Install the check tools only
        run: apt-get update && apt-get install -y --no-install-recommends python3 binutils
      - name: Completeness checks in a clean container
        run: python3 tools/ci/check_completeness.py kit/lib/yantra/plugins/radios
      - name: Conformance kit in a clean container (RAD-91, RAD-133)
        run: |
          chmod +x kit/bin/yantra-radio-host
          python3 tools/ci/clean_env.py --sandbox none --host kit/bin/yantra-radio-host \
            --plugins kit/lib/yantra/plugins/radios --plugins kit/tests/radio-plugins \
            --fixture tests/radio/fixtures/soapy/fake_two_cells.json --report-dir conformance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-x86-64-conformance-clean
          path: conformance/
          if-no-files-found: ignore

  # RAD-141: the radio parts alone (radio API, radio plugins, generator,
  # tools and their tests), without the application or its libraries.
  radio-parts:
    # By hand only (Actions minutes); the build job builds the radio parts.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build tools and the cross SDK (RAD-139)
        uses: ./.github/actions/linux-sdk
      - name: Linux steps of the radio parts (warnings are errors)
        run: tools/ci/run_linux.sh build-radios

  linux-x86-64-gcc:
    # OA-02: gcc as the second Linux tree; by hand only (Actions minutes).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ python3 python3-yaml binutils pipx libsqlite3-dev libzstd-dev libhpdf-dev pkg-config \
            libglfw3-dev libgl-dev libcurl4-openssl-dev cargo rustc doxygen curl
          pipx install reuse
      - name: Configure (warnings are errors)
        run: cmake --preset ci-gcc
      - name: Build
        run: cmake --build --preset ci-gcc -j "$(nproc)"
      - name: Fast tests
        run: ctest --test-dir build-gcc -LE 'slow|timing' --timeout 600 --output-on-failure -j "$(nproc)"

  docs:
    # By hand only (Actions minutes). DOC-20: the documentation built from Markdown to HTML and PDF
    # (pandoc, WeasyPrint), every relative link and picture checked
    # offline (external links are listed, never fetched), with the plugin
    # API reference (DOC-17); the site is kept as an artifact.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ python3 pkg-config libsqlite3-dev libzstd-dev libhpdf-dev \
            libglfw3-dev libgl-dev libcurl4-openssl-dev cargo rustc doxygen curl pandoc weasyprint
      - name: Configure
        run: cmake --preset ci-gcc
      - name: Build the documentation and check links and pictures
        run: cmake --build build-gcc --target docs
      - name: Keep the documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: |
            build-gcc/docs/site
            !build-gcc/docs/site/build.log
