# SPDX-License-Identifier: GPL-3.0-or-later
#
# CI on every push and pull request (TST-02, OA-02): lint (shell, YAML and
# Python syntax, the workflow files parsed with PyYAML, reuse lint), the
# Linux x86-64 build with clang from the cross SDK of the yantra-radios
# submodule (RAD-139; cached by its lock files) and a second job with the
# system's gcc, both with warnings as errors, then the fast tests (ctest
# -LE slow, timeout 600 s) with the timing-sensitive tests retried once.
# Windows x64 (OA-02, NFR-09): windows-cross builds the Windows tree on
# Linux with the SDK's clang and Yantra's MSYS2 lock, runs the build-machine
# checks and makes the zip and setup .exe; windows-x64-tests runs the
# tree's ctest natively on a Windows runner, with the packages' tests. The
# native MSYS2 UCRT64 check is windows.yml. Written and YAML-linted, never
# run (no remote).
# The yantra-radios submodule (third_party/yantra-radios, PLG-26) is
# checked out with the repository.
# Adapted from yantra-radios fb194f5: .github/workflows/ci.yml.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SDK_KEY: yantra-sdk-${{ hashFiles('third_party/yantra-radios/tools/sdk/*.lock', 'third_party/yantra-radios/tools/sdk/yantra_sdk.py') }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-yaml pipx
          pipx install reuse
      - name: Shell, Python and YAML syntax
        run: YANTRA_LINT_REQUIRE_TOOLS=1 sh tools/ci/lint.sh
      - name: Workflow YAML parses (PyYAML)
        run: |
          python3 -c 'import sys, yaml
          for f in sys.argv[1:]:
              yaml.safe_load(open(f))' .github/workflows/*.yml
      - name: REUSE compliance
        run: reuse lint

  linux-x86-64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build python3 python3-yaml binutils pipx gpg zstd libsqlite3-dev libzstd-dev libhpdf-dev pkg-config \
            libglfw3-dev libgl-dev libcurl4-openssl-dev doxygen curl
          pipx install reuse
      - name: Cache the cross SDK (OA-02, RAD-139)
        uses: actions/cache@v4
        with:
          path: sdk
          key: ${{ env.SDK_KEY }}-${{ runner.os }}-${{ runner.arch }}
      - name: Cross SDK (made from the submodule's lock files, else checked)
        env:
          YANTRA_SDK_DIR: ${{ github.workspace }}/sdk
        run: |
          python3 third_party/yantra-radios/tools/sdk/yantra_sdk.py check --sdk-dir "$YANTRA_SDK_DIR" ||
            python3 third_party/yantra-radios/tools/sdk/yantra_sdk.py make --sdk-dir "$YANTRA_SDK_DIR"
      - name: Submodule commit
        id: radios
        run: echo "commit=$(git rev-parse HEAD:third_party/yantra-radios)" >> "$GITHUB_OUTPUT"
      - name: Cache the radio plugin dependency builds (PLG-26)
        uses: actions/cache@v4
        with:
          path: build/radios-cache
          key: radios-deps-${{ steps.radios.outputs.commit }}-${{ env.SDK_KEY }}-${{ runner.os }}-${{ runner.arch }}
      - name: Configure (warnings are errors)
        env:
          YANTRA_SDK_DIR: ${{ github.workspace }}/sdk
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci -j "$(nproc)"
      - name: Fast tests
        run: ctest --test-dir build -LE 'slow|timing' --timeout 600 --output-on-failure -j "$(nproc)"
      - name: Documentation checks and examples (DOC-17, DOC-21, SCR-07)
        # Links, images, quoted code, the plugin API reference without a
        # Doxygen warning, the marked examples of the file-format and API
        # docs read back by their readers (doc_examples) and the API's
        # shell examples run against yantra-probe --demo (doc_api_examples).
        run: ctest --test-dir build -L docs --timeout 600 --output-on-failure
      - name: Plugin API reference (DOC-17)
        run: cmake --build build --target docs-plugin-api
      - name: Keep the plugin API reference
        uses: actions/upload-artifact@v4
        with:
          name: plugin-api-reference
          path: build/docs/plugin-api/html
      - name: Sample report (DEMO-06)
        # The Fraunces demo's report made again and compared with the
        # committed docs/samples within the set tolerance; an intended
        # change commits the new sample (ninja -C build sample_report).
        run: ctest --test-dir build -R '^sample_report_compare$' --timeout 900 --output-on-failure
      - name: Keep the regenerated sample report when it differs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sample-report
          path: build/tests/report/scratch/sample_report/*_report.*
          if-no-files-found: ignore
      - name: Timing-sensitive tests (retried once)
        run: ctest --test-dir build -L timing -LE slow --timeout 600 --output-on-failure --repeat until-pass:2

  linux-x86-64-gcc:
    # OA-02: gcc as the second Linux tree.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ python3 python3-yaml binutils pipx libsqlite3-dev libzstd-dev libhpdf-dev pkg-config \
            libglfw3-dev libgl-dev libcurl4-openssl-dev cargo rustc doxygen curl
          pipx install reuse
      - name: Submodule commit
        id: radios
        run: echo "commit=$(git rev-parse HEAD:third_party/yantra-radios)" >> "$GITHUB_OUTPUT"
      - name: Cache the radio plugin dependency builds (PLG-26)
        uses: actions/cache@v4
        with:
          path: build-gcc/radios-cache
          key: radios-deps-${{ steps.radios.outputs.commit }}-gcc-${{ runner.os }}-${{ runner.arch }}
      - name: Configure (warnings are errors)
        run: cmake --preset ci-gcc
      - name: Build
        run: cmake --build --preset ci-gcc -j "$(nproc)"
      - name: Fast tests
        run: ctest --test-dir build-gcc -LE 'slow|timing' --timeout 600 --output-on-failure -j "$(nproc)"
      - name: Timing-sensitive tests (retried once)
        run: ctest --test-dir build-gcc -L timing -LE slow --timeout 600 --output-on-failure --repeat until-pass:2

  # Windows x64 (OA-02, TST-02, NFR-09): cross-compiled on Linux with
  # clang from the SDK and Yantra's lock of MSYS2 UCRT64 packages. The
  # Linux tree comes first (it makes the build-time data: demo projects,
  # record files). The build-machine checks (label build_host, among them
  # the packages' DLL import check) run here; the tests themselves on the
  # Windows runner below.
  windows-cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build python3 python3-yaml binutils pipx gpg zstd libsqlite3-dev libzstd-dev libhpdf-dev pkg-config \
            libglfw3-dev libgl-dev libcurl4-openssl-dev doxygen curl pandoc weasyprint nsis
          pipx install reuse
      - name: Cache the cross SDK with Yantra's MSYS2 packages (OA-02, RAD-139)
        uses: actions/cache@v4
        with:
          path: sdk
          key: ${{ env.SDK_KEY }}-${{ hashFiles('tools/windows/msys2.lock') }}-${{ runner.os }}-${{ runner.arch }}
      - name: Cross SDK (made from the lock files, else checked)
        env:
          YANTRA_SDK_DIR: ${{ github.workspace }}/sdk
        run: |
          python3 third_party/yantra-radios/tools/sdk/yantra_sdk.py check --sdk-dir "$YANTRA_SDK_DIR" --msys2-lock tools/windows/msys2.lock ||
            python3 third_party/yantra-radios/tools/sdk/yantra_sdk.py make --sdk-dir "$YANTRA_SDK_DIR" --msys2-lock tools/windows/msys2.lock
      - name: Submodule commit
        id: radios
        run: echo "commit=$(git rev-parse HEAD:third_party/yantra-radios)" >> "$GITHUB_OUTPUT"
      - name: Cache the radio plugin dependency builds (PLG-26)
        uses: actions/cache@v4
        with:
          path: |
            build/radios-cache
            build-win/radios-cache
          key: radios-deps-windows-${{ steps.radios.outputs.commit }}-${{ env.SDK_KEY }}-${{ runner.os }}-${{ runner.arch }}
      - name: Linux tree (build-time data of the Windows tree)
        env:
          YANTRA_SDK_DIR: ${{ github.workspace }}/sdk
        run: |
          cmake --preset ci
          cmake --build --preset ci -j "$(nproc)"
      - name: Configure the Windows tree (warnings are errors)
        env:
          YANTRA_SDK_DIR: ${{ github.workspace }}/sdk
        run: cmake --preset ci-windows
      - name: Build the Windows tree
        run: cmake --build build-win -j "$(nproc)"
      - name: Windows zip and setup .exe (NFR-09)
        run: cmake --build build-win --target package-windows
      - name: Build-machine checks (DLL import check of the packages, lints, docs)
        run: ctest --test-dir build-win -L build_host --timeout 600 --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-packages
          path: |
            build-win/package/*.zip
            build-win/package/*-setup.exe
            build-win/package/SHA256SUMS
          if-no-files-found: error
      # The tree without objects and archives: the programs, plugins, DLLs,
      # test data made by the build, the packages and the ctest files.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-tree
          path: |
            build-win/
            !build-win/**/*.obj
            !build-win/**/*.a
            !build-win/**/CMakeFiles/
            !build-win/radios/build/
            !build-win/radios-cache/
            !build-win/_deps/*.tgz
          if-no-files-found: error

  # The cross-compiled tree's ctest natively on Windows, without MSYS2 or
  # build tools on PATH: the tests and the packages' tests (the unpacked
  # zip, a silent install and uninstall of the setup .exe). The test files
  # hold the Linux paths of the cross job (/home/runner/work/..., the
  # Linux job's /usr/bin/cmake and /usr/bin/python3); Windows reads a rooted
  # path on the current drive, so those paths are linked or copied there.
  windows-x64-tests:
    needs: windows-cross
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64-tree
          path: build-win
      - name: Link the cross job's paths to the checkout, CMake and Python
        shell: pwsh
        run: |
          $linux = "${{ github.workspace }}" -replace '^[A-Za-z]:\\a\\', '\home\runner\work\'
          $drive = (Get-Location).Drive.Name + ':'
          New-Item -ItemType Directory -Force -Path (Split-Path "$drive$linux") | Out-Null
          New-Item -ItemType Junction -Path "$drive$linux" -Target "${{ github.workspace }}" | Out-Null
          $usr = "$drive\usr"
          New-Item -ItemType Directory -Force -Path "$usr\bin" | Out-Null
          Copy-Item -Recurse -Force "$env:ProgramFiles\CMake\*" $usr
          Copy-Item -Recurse -Force "$(Split-Path (Get-Command python).Source)\*" "$usr\bin"
          Copy-Item "$usr\bin\python.exe" "$usr\bin\python3.exe"
          "YANTRA_LINUX_PATH=$drive$linux" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Fast tests and the packages' tests
        shell: pwsh
        run: |
          Set-Location $env:YANTRA_LINUX_PATH
          ctest --test-dir build-win -LE 'slow|timing' --timeout 600 --output-on-failure -j 4
      - name: Timing-sensitive tests (retried once)
        shell: pwsh
        run: |
          Set-Location $env:YANTRA_LINUX_PATH
          ctest --test-dir build-win -L timing -LE slow --timeout 600 --output-on-failure --repeat until-pass:2

  docs:
    # DOC-20: the documentation built from Markdown to HTML and PDF
    # (pandoc, WeasyPrint), every relative link and picture checked
    # offline (external links are listed, never fetched), with the plugin
    # API reference (DOC-17); the site is kept as an artifact.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ python3 pkg-config libsqlite3-dev libzstd-dev libhpdf-dev \
            libglfw3-dev libgl-dev libcurl4-openssl-dev cargo rustc doxygen curl pandoc weasyprint
      - name: Configure
        run: cmake --preset ci-gcc
      - name: Build the documentation and check links and pictures
        run: cmake --build build-gcc --target docs
      - name: Keep the documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: |
            build-gcc/docs/site
            !build-gcc/docs/site/build.log
