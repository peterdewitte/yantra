#
# CI on every push and pull request (TST-02, OA-02): lint (shell, YAML and
# Python syntax, reuse lint) and the Linux x86-64 build with warnings as
# errors, then the fast tests (ctest -LE slow, timeout 600 s) with the
# timing-sensitive tests retried once. The Windows x64 (MSYS2 UCRT64) job
# is in windows.yml: DEFERRED (Windows), written but not run.
# The yantra-radios submodule (third_party/yantra-radios, PLG-26) is
# checked out with the repository.
# Adapted from yantra-radios fb194f5: .github/workflows/ci.yml.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-yaml pipx
          pipx install reuse
      - name: Shell, Python and YAML syntax
        run: YANTRA_LINT_REQUIRE_TOOLS=1 sh tools/ci/lint.sh
      - name: REUSE compliance
        run: reuse lint

  linux-x86-64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ python3 python3-yaml binutils pipx libsqlite3-dev libzstd-dev libhpdf-dev pkg-config \
            libglfw3-dev libgl-dev libcurl4-openssl-dev cargo rustc doxygen curl
          pipx install reuse
      - name: Submodule commit
        id: radios
        run: echo "commit=$(git rev-parse HEAD:third_party/yantra-radios)" >> "$GITHUB_OUTPUT"
      - name: Cache the radio plugin dependency builds (PLG-26)
        uses: actions/cache@v4
        with:
          path: build/radios-cache
          key: radios-deps-${{ steps.radios.outputs.commit }}-${{ runner.os }}-${{ runner.arch }}
      - name: Configure (warnings are errors)
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci -j "$(nproc)"
      - name: Fast tests
        run: ctest --test-dir build -LE 'slow|timing' --timeout 600 --output-on-failure -j "$(nproc)"
      - name: Documentation checks and examples (DOC-17, DOC-21, SCR-07)
        # Links, images, quoted code, the plugin API reference without a
        # Doxygen warning, the marked examples of the file-format and API
        # docs read back by their readers (doc_examples) and the API's
        # shell examples run against yantra-probe --demo (doc_api_examples).
        run: ctest --test-dir build -L docs --timeout 600 --output-on-failure
      - name: Plugin API reference (DOC-17)
        run: cmake --build build --target docs-plugin-api
      - name: Keep the plugin API reference
        uses: actions/upload-artifact@v4
        with:
          name: plugin-api-reference
          path: build/docs/plugin-api/html
      - name: Sample report (DEMO-06)
        # The Fraunces demo's report made again and compared with the
        # committed docs/samples within the set tolerance; an intended
        # change commits the new sample (ninja -C build sample_report).
        run: ctest --test-dir build -R '^sample_report_compare$' --timeout 900 --output-on-failure
      - name: Keep the regenerated sample report when it differs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sample-report
          path: build/tests/report/scratch/sample_report/*_report.*
          if-no-files-found: ignore
      - name: Timing-sensitive tests (retried once)
        run: ctest --test-dir build -L timing -LE slow --timeout 600 --output-on-failure --repeat until-pass:2

  docs:
    # DOC-20: the documentation built from Markdown to HTML and PDF
    # (pandoc, WeasyPrint), every relative link and picture checked
    # offline (external links are listed, never fetched), with the plugin
    # API reference (DOC-17); the site is kept as an artifact.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ python3 pkg-config libsqlite3-dev libzstd-dev libhpdf-dev \
            libglfw3-dev libgl-dev libcurl4-openssl-dev cargo rustc doxygen curl pandoc weasyprint
      - name: Configure
        run: cmake --preset ci
      - name: Build the documentation and check links and pictures
        run: cmake --build build --target docs
      - name: Keep the documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: |
            build/docs/site
            !build/docs/site/build.log
