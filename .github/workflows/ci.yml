#
# CI on every push and pull request (RAD-134, RAD-90): lint (shell, YAML,
# Python, FFI widths, reuse lint, cargo-deny), Linux builds with warnings
# as errors + fast tests (clang of the cross SDK, the default compiler, and
# the system gcc; RAD-03, RAD-139), the Windows x64 tree cross-compiled
# with the SDK's clang on Linux (completeness checks there) and its tests
# run natively on a Windows runner (RAD-131), and the completeness checks
# (RAD-133). Locally the same Linux steps run with tools/ci/run_linux.sh
# (YANTRA_CI_COMPILER=clang|gcc); the Windows tree with the preset
# "windows" and its ctest in a Windows test VM (BUILD.md). The native MSYS2
# UCRT64 build is windows-check.yml.
# Copied from yantra 68ea20a: .github/workflows/ci.yml, adapted for RAD-134.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Static dependency builds (RAD-136), cached per script version.
  DEPS_KEY: deps-${{ hashFiles('tools/deps/**', 'third_party/**') }}
  # The cross SDK (RAD-139), cached per lock-file version.
  SDK_KEY: yantra-sdk-${{ hashFiles('tools/sdk/*.lock', 'tools/sdk/yantra_sdk.py') }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-yaml pipx
          pipx install reuse
      - name: Cache cargo-deny
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-deny
        run: command -v cargo-deny || cargo install --locked cargo-deny@0.20.2
      - name: Shell, Python and YAML syntax, FFI widths, cargo-deny
        run: YANTRA_LINT_REQUIRE_TOOLS=1 sh tools/ci/lint.sh
      - name: Workflow YAML parses (PyYAML)
        run: |
          python3 -c 'import sys, yaml
          for f in sys.argv[1:]:
              yaml.safe_load(open(f))' .github/workflows/*.yml
      - name: REUSE compliance
        run: reuse lint
      - name: Vendored sources match their release archives (RAD-136)
        run: python3 tools/deps/verify_sources.py build/deps-cache

  # Default compiler: clang of the cross SDK (RAD-03, RAD-139), with the
  # SDK's lld and Rust. The SDK is cached per lock-file version.
  linux-x86-64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build python3 python3-yaml binutils gpg zstd pipx
          pipx install reuse
      - name: Cache the cross SDK (RAD-139)
        uses: actions/cache@v4
        with:
          path: sdk
          key: ${{ env.SDK_KEY }}-${{ runner.os }}-${{ runner.arch }}
      - name: Cross SDK (made from the lock files, else checked)
        run: python3 tools/sdk/yantra_sdk.py check || python3 tools/sdk/yantra_sdk.py make
      - name: Cache the dependency builds (RAD-136)
        uses: actions/cache@v4
        with:
          path: build/deps
          key: ${{ env.DEPS_KEY }}-${{ env.SDK_KEY }}-${{ runner.os }}-${{ runner.arch }}
      - name: Static dependency builds (RAD-136)
        env:
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/tools/sdk/toolchain-x86_64-linux-gnu-clang.cmake
        run: tools/deps/build_deps.sh build/deps
      - name: Configure (warnings are errors)
        run: cmake --preset ci -DYANTRA_DEPS_PREFIX="$PWD/build/deps"
      - name: Build
        run: cmake --build --preset ci -j "$(nproc)"
      - name: Fast tests
        run: ctest --test-dir build -LE 'slow|timing' --timeout 600 --output-on-failure -j "$(nproc)"
      - name: Timing-sensitive tests (retried once)
        run: ctest --test-dir build -L timing -LE slow --timeout 600 --output-on-failure --repeat until-pass:2
      - name: Completeness checks (RAD-133)
        run: python3 tools/ci/check_completeness.py build/bin/plugins
      - name: Conformance kit on every plugin (RAD-91)
        run: |
          for p in build/bin/plugins/*.so; do
            build/bin/yantra-radio-host conformance --plugin "$p" \
              --report "build/conformance/$(basename "$p" .so).json"
          done
      # The plugins and the test host (with the kit) for the clean run.
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86-64-plugins
          path: |
            build/bin/plugins/
            build/tests/plugins/
            build/bin/yantra-radio-host
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86-64-conformance
          path: build/conformance/
          if-no-files-found: ignore

  # The second Linux compiler: the system gcc (RAD-03), tree build-gcc.
  linux-x86-64-gcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ cargo python3 python3-yaml binutils pipx
          pipx install reuse
      - name: Cache the dependency builds (RAD-136)
        uses: actions/cache@v4
        with:
          path: build-gcc/deps
          key: ${{ env.DEPS_KEY }}-gcc-${{ runner.os }}-${{ runner.arch }}
      - name: Static dependency builds (RAD-136)
        env:
          CC: gcc
          CXX: g++
        run: tools/deps/build_deps.sh build-gcc/deps
      - name: Configure (warnings are errors)
        run: cmake --preset ci-gcc -DYANTRA_DEPS_PREFIX="$PWD/build-gcc/deps"
      - name: Build
        run: cmake --build --preset ci-gcc -j "$(nproc)"
      - name: Fast tests
        run: ctest --test-dir build-gcc -LE 'slow|timing' --timeout 600 --output-on-failure -j "$(nproc)"
      - name: Timing-sensitive tests (retried once)
        run: ctest --test-dir build-gcc -L timing -LE slow --timeout 600 --output-on-failure --repeat until-pass:2
      - name: Completeness checks (RAD-133)
        run: python3 tools/ci/check_completeness.py build-gcc/bin/plugins

  # RAD-133: the plugins in a clean environment, without SoapySDR or
  # vendor packages: a bare container that only gets the built plugins,
  # the fake-module test builds (RAD-92), the test host and Python. It
  # re-runs the NEEDED and export checks and the conformance kit on every
  # plugin where no build dependency is installed, so a plugin that needs
  # a library of the build machine fails here. Locally the same script
  # runs in a bubblewrap sandbox (ctest clean_env_conformance).
  completeness-clean:
    needs: linux-x86-64
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86-64-plugins
          path: kit
      - name: Install the check tools only
        run: apt-get update && apt-get install -y --no-install-recommends python3 binutils
      - name: Completeness checks in a clean container
        run: python3 tools/ci/check_completeness.py kit/bin/plugins
      - name: Conformance kit in a clean container (RAD-91, RAD-133)
        run: |
          chmod +x kit/bin/yantra-radio-host
          python3 tools/ci/clean_env.py --sandbox none --host kit/bin/yantra-radio-host \
            --plugins kit/bin/plugins --plugins kit/tests/plugins \
            --fixture tests/fixtures/soapy/fake_two_cells.json --report-dir conformance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-x86-64-conformance-clean
          path: conformance/
          if-no-files-found: ignore

  # Windows x64 (RAD-131, RAD-139): cross-compiled on Linux with the
  # SDK's clang, lld and Rust (target x86_64-pc-windows-gnu), bundled
  # libraries cross-built statically (RAD-136). The .exe cannot run here,
  # so every doctest binary is one ctest (<group>/all; ctest on Windows
  # lists the cases); the completeness checks (imports, exports, build
  # paths) and the release package run here, the tests on the Windows
  # runner below.
  windows-cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build python3 python3-yaml gpg zstd
      - name: Cache the cross SDK (RAD-139)
        uses: actions/cache@v4
        with:
          path: sdk
          key: ${{ env.SDK_KEY }}-${{ runner.os }}-${{ runner.arch }}
      - name: Cross SDK (made from the lock files, else checked)
        run: python3 tools/sdk/yantra_sdk.py check || python3 tools/sdk/yantra_sdk.py make
      - name: Cache the dependency builds (RAD-136)
        uses: actions/cache@v4
        with:
          path: build-win-deps
          key: ${{ env.DEPS_KEY }}-${{ env.SDK_KEY }}-windows-x86-64
      - name: Static dependency builds for Windows (RAD-136)
        env:
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/tools/sdk/toolchain-x86_64-w64-mingw32-clang.cmake
        run: tools/deps/build_deps.sh build-win-deps
      - name: Configure (warnings are errors)
        run: cmake --preset ci-windows -DYANTRA_DEPS_PREFIX="$PWD/build-win-deps"
      - name: Build
        run: cmake --build --preset ci-windows -j "$(nproc)"
      - name: Completeness checks and release package (RAD-133, RAD-98)
        run: ctest --test-dir build-win -L 'completeness|release' --timeout 600 --output-on-failure
      - name: Test list for the Windows runner
        run: ctest --test-dir build-win --show-only=json-v1 > build-win/tests.json
      # The tree without objects and archives: the programs, plugins, test
      # data made by the build and the test list.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86-64-tree
          path: |
            build-win/
            !build-win/**/*.obj
            !build-win/**/*.a
            !build-win/cargo/
            !build-win/cargo-lib/
            !build-win/CMakeFiles/
          if-no-files-found: error

  # The cross-compiled tests natively on Windows: a machine without the
  # build tools and without MSYS2 on PATH (RAD-132, RAD-133). The test
  # programs hold the Linux paths of the cross job; Windows reads a rooted
  # path on the current drive, so that path is linked to the checkout and
  # the tests run from there (tools/ci/run_windows_tests.py).
  windows-x86-64-tests:
    needs: windows-cross
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86-64-tree
          path: build-win
      - name: Link the cross job's path to the checkout
        shell: pwsh
        run: |
          $linux = "${{ github.workspace }}" -replace '^[A-Za-z]:\\a\\', '\home\runner\work\'
          $drive = (Get-Location).Drive.Name + ':'
          New-Item -ItemType Directory -Force -Path (Split-Path "$drive$linux") | Out-Null
          New-Item -ItemType Junction -Path "$drive$linux" -Target "${{ github.workspace }}" | Out-Null
          "YANTRA_LINUX_PATH=$drive$linux" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Tests (every Windows program of the tree)
        shell: pwsh
        run: |
          Set-Location $env:YANTRA_LINUX_PATH
          python tools/ci/run_windows_tests.py --tests build-win/tests.json
      - name: Conformance kit on every plugin (RAD-91)
        shell: pwsh
        run: |
          Set-Location $env:YANTRA_LINUX_PATH
          New-Item -ItemType Directory -Force conformance | Out-Null
          foreach ($p in Get-ChildItem build-win/bin/plugins/*.dll) {
            if ($p.BaseName -eq 'pei') { continue }  # needs a terminal (13.5)
            & build-win/bin/yantra-radio-host.exe conformance --plugin $p.FullName --report "conformance/$($p.BaseName).json"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-x86-64-conformance
          path: conformance/
          if-no-files-found: ignore
