#
# Packages workflow (TST-64, NFR-09, OA-02): build.yml with packages
# (in an ubuntu:26.04 container, clang from the cross SDK in tools/sdk,
# RAD-139, cached by its lock files): the Linux x86-64 tree and its
# functional tests, the .deb (`ninja deb`, packaging/deb) with the PDF
# manual and its package test, the Windows x64 tree cross-compiled from it
# with the NSIS setup .exe and the portable zip (`ninja package-windows`,
# packaging/windows), and the Windows tree's functional tests natively on a
# Windows runner. On a version tag v<version> (matching the product
# version in the file VERSION, PLG-29) the .deb, the setup .exe and the
# PDF manual become the assets of a GitHub release with SHA256SUMS and the
# notes of that CHANGELOG.md section (tools/ci/release_notes.py). Runs on
# a tag and by hand (the zip stays a workflow artifact).

name: packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The trees, their functional tests and the packages (artifacts
  # linux-x86_64-packages and windows-x86_64-packages).
  build:
    uses: ./.github/workflows/build.yml
    with:
      packages: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64-packages
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64-packages
          path: dist
      - name: Checksums over every asset (SHA-256)
        run: |
          find dist -mindepth 2 -type f -exec mv -t dist {} +
          find dist -mindepth 1 -type d -delete
          # The release assets: the .deb, the setup .exe and the PDF manual.
          rm -f dist/*.zip
          cd dist
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: python3 tools/ci/release_notes.py CHANGELOG.md "$GITHUB_REF_NAME" > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Yantra $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
